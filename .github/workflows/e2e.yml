name: Testes E2E - WeMovies

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      - name: Validar os tipos
        run: npm run typecheck

      - name: Executar os três cenários E2E
        run: npm run test:e2e

      - name: Salvar o relatório e as evidências
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
